<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="// fluxo de uma requisição no peopleos: Cliente React → Routes → Middlewares → Controllers → Services → Repositories → MySQL; Services → Auditoria + log de acesso, Holerite em PDF">
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6e7681"/></marker>
</defs>
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  .flow{stroke-dasharray:4 6;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-20}}
</style>
<rect x=".5" y=".5" width="999" height="269" rx="14" fill="url(#cbg)" stroke="#30363d"/>
<text x="24" y="40" class="mono" font-size="13" fill="#58a6ff" letter-spacing=".5">// fluxo de uma requisição no peopleos</text>
<g class="in" style="animation-delay:0.20s">
  <circle cx="810" cy="36" r="4.5" fill="#39c5cf"/><text x="820" y="40" class="mono" font-size="11" fill="#8b949e">requisição</text>
  <circle cx="900" cy="36" r="4.5" fill="#3fb950"/><text x="910" y="40" class="mono" font-size="11" fill="#8b949e">resposta</text>
</g>
<path d="M142 107H156" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M282 107H296" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M422 107H436" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M562 107H576" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M702 107H716" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M842 107H856" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
<g fill="none" stroke="#a371f7" stroke-opacity=".7" stroke-width="1.5" class="flow">
    <path d="M640 130V168H560V190"/><path d="M640 168H800V190"/></g>
<circle r="4.5" fill="#39c5cf" opacity="0"><set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/><animateMotion path="M80 107H920" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#3fb950" opacity="0"><set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/><animateMotion path="M920 107H80" dur="3.2s" begin="2.8s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#a371f7" opacity="0"><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/><animateMotion path="M640 130V168H560V190" dur="1.6s" begin="2.4s" repeatCount="indefinite"/></circle>
  <g class="in" style="animation-delay:0.20s">
    <rect x="21" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#39c5cf" stroke-opacity=".75"/>
    <text x="80" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Cliente React</text>
  </g>
  <g class="in" style="animation-delay:0.30s">
    <rect x="161" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/>
    <text x="220" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Routes</text>
  </g>
  <g class="in" style="animation-delay:0.40s">
    <rect x="301" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/>
    <text x="360" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Middlewares</text>
  </g>
  <g class="in" style="animation-delay:0.50s">
    <rect x="441" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/>
    <text x="500" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Controllers</text>
  </g>
  <g class="in" style="animation-delay:0.60s">
    <rect x="581" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/>
    <text x="640" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Services</text>
  </g>
  <g class="in" style="animation-delay:0.70s">
    <rect x="721" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#d29922" stroke-opacity=".75"/>
    <text x="780" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Repositories</text>
  </g>
  <g class="in" style="animation-delay:0.80s">
    <rect x="861" y="84" width="118" height="46" rx="10" fill="#161b22" stroke="#d29922" stroke-opacity=".75"/>
    <text x="920" y="112" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">MySQL</text>
  </g>
<text x="360" y="152" text-anchor="middle" class="mono in" font-size="11" fill="#6e7681" style="animation-delay:0.60s">auth · role · scope · validate</text>
  <g class="in" style="animation-delay:1.00s">
    <rect x="450" y="190" width="220" height="46" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/>
    <text x="560" y="218" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Auditoria + log de acesso</text>
  </g>
  <g class="in" style="animation-delay:1.10s">
    <rect x="715" y="190" width="170" height="46" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/>
    <text x="800" y="218" text-anchor="middle" class="mono" font-size="13" fill="#e6edf3">Holerite em PDF</text>
  </g>
</svg>