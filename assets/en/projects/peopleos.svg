<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
<title id="t">PeopleOS</title>
<desc id="d">HR system with a payroll calculation engine: 13th salary in installments, prorated pay, alimony deductions and PDF payslips. Role- and unit-based access control, audit trail, migrations and 20+ test suites. Stack: Node.js, Express 5, MySQL, JWT, bcrypt, PDFKit, React 19, node:test.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  .orbit{stroke-dasharray:120 2337;animation:orbit 7s linear infinite}
  @keyframes orbit{to{stroke-dashoffset:-2457}}</style>
<rect x="2" y="2" width="996" height="246" rx="16" fill="url(#bg)" stroke="#30363d"/>
<rect x="2" y="2" width="996" height="246" rx="16" fill="url(#glow)"/>
<rect x="2" y="2" width="996" height="246" rx="16" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-opacity=".9" class="orbit"/>
<rect x="28" y="30" width="4" height="64" rx="2" fill="#58a6ff"/>
<line x1="660" y1="78" x2="660" y2="206" stroke="#30363d"/><g class="in" style="animation-delay:0.50s"><text x="686" y="104" class="mono" font-size="26" font-weight="700" fill="#58a6ff">11</text><text x="729.2" y="99" class="sans" font-size="14" fill="#8b949e">REST API modules</text></g><g class="in" style="animation-delay:0.65s"><text x="686" y="148" class="mono" font-size="26" font-weight="700" fill="#58a6ff">6</text><text x="713.6" y="143" class="sans" font-size="14" fill="#8b949e">middlewares (auth, RBAC, scope)</text></g><g class="in" style="animation-delay:0.80s"><text x="686" y="192" class="mono" font-size="26" font-weight="700" fill="#58a6ff">20+</text><text x="744.8" y="187" class="sans" font-size="14" fill="#8b949e">automated test suites</text></g>
<g class="in" style="animation-delay:0.10s">
  <text x="46" y="46" class="mono" font-size="12" fill="#58a6ff" letter-spacing=".5">BACK-END · HR &amp; PAYROLL</text>
  <text x="46" y="86" class="sans" font-size="32" font-weight="700" fill="#e6edf3">PeopleOS</text>
</g>
<g class="in" style="animation-delay:0.20s"><text x="970" y="46" text-anchor="end" class="mono" font-size="12" fill="#8b949e">private · in development</text><circle cx="789.2" cy="42" r="4" fill="#d29922"/></g>
<g class="in" style="animation-delay:0.30s">
<text x="46" y="128" class="sans" font-size="16" fill="#8b949e">HR system with a payroll calculation engine: 13th salary in installments,</text>
<text x="46" y="152" class="sans" font-size="16" fill="#8b949e">prorated pay, alimony deductions and PDF payslips. Role- and unit-based</text>
<text x="46" y="176" class="sans" font-size="16" fill="#8b949e">access control, audit trail, migrations and 20+ test suites.</text>
</g>
<g class="in" style="animation-delay:0.45s"><g transform="translate(46 192)"><rect width="72.4" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">Node.js</text></g><g transform="translate(126.4 192)"><rect width="86.8" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">Express 5</text></g><g transform="translate(221.2 192)"><rect width="58" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">MySQL</text></g><g transform="translate(287.2 192)"><rect width="43.599999999999994" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">JWT</text></g><g transform="translate(338.79999999999995 192)"><rect width="65.19999999999999" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">bcrypt</text></g><g transform="translate(411.99999999999994 192)"><rect width="65.19999999999999" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">PDFKit</text></g><g transform="translate(485.19999999999993 192)"><rect width="79.6" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">React 19</text></g><g transform="translate(572.8 192)"><rect width="86.8" height="27" rx="13.5" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#58a6ff">node:test</text></g></g>
</svg>