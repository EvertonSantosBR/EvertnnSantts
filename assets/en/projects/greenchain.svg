<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270" role="img" aria-labelledby="t d">
<title id="t">GreenChain</title>
<desc id="d">Recycle-to-Earn platform: smart bins (IoT simulator) reward recycling with $GREEN tokens on Celo. Dashboards for users and companies. Stack: Next.js, TypeScript, Solidity, Hardhat.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#3fb950" stop-opacity=".18"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  .orbit{stroke-dasharray:120 1357;animation:orbit 7s linear infinite}
  @keyframes orbit{to{stroke-dashoffset:-1477}}</style>
<rect x="2" y="2" width="486" height="266" rx="16" fill="url(#bg)" stroke="#30363d"/>
<rect x="2" y="2" width="486" height="266" rx="16" fill="url(#glow)"/>
<rect x="2" y="2" width="486" height="266" rx="16" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-opacity=".9" class="orbit"/>
<rect x="28" y="30" width="4" height="62" rx="2" fill="#3fb950"/>
<text x="464" y="248" text-anchor="end" class="mono" font-size="56" font-weight="700" fill="#3fb950" fill-opacity=".08">03</text>
<g class="in" style="animation-delay:0.10s">
  <text x="46" y="46" class="mono" font-size="12" fill="#3fb950" letter-spacing=".5">WEB3 · SUSTAINABILITY</text>
  <text x="46" y="84" class="sans" font-size="26" font-weight="700" fill="#e6edf3">GreenChain</text>
</g>
<g class="in" style="animation-delay:0.20s"><text x="460" y="46" text-anchor="end" class="mono" font-size="12" fill="#8b949e">updated Jun 2026</text></g>
<g class="in" style="animation-delay:0.30s">
<text x="46" y="124" class="sans" font-size="15" fill="#8b949e">Recycle-to-Earn platform: smart bins (IoT</text>
<text x="46" y="148" class="sans" font-size="15" fill="#8b949e">simulator) reward recycling with $GREEN tokens</text>
<text x="46" y="172" class="sans" font-size="15" fill="#8b949e">on Celo. Dashboards for users and companies.</text>
</g>
<g class="in" style="animation-delay:0.45s"><g transform="translate(46 212)"><rect width="72.4" height="27" rx="13.5" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#3fb950">Next.js</text></g><g transform="translate(126.4 212)"><rect width="94" height="27" rx="13.5" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#3fb950">TypeScript</text></g><g transform="translate(228.4 212)"><rect width="79.6" height="27" rx="13.5" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#3fb950">Solidity</text></g><g transform="translate(316 212)"><rect width="72.4" height="27" rx="13.5" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".45"/><text x="11" y="15" class="mono" font-size="12" fill="#3fb950">Hardhat</text></g></g>
</svg>