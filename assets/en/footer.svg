  <path d="M-1200 104 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 q75 -10 150 0 t150 0 V150 H-1200 Z" fill="#58a6ff" fill-opacity="0.18"><animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="5s" repeatCount="indefinite"/></path>
  <path d="M-1200 118 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 q75 -8 150 0 t150 0 V150 H-1200 Z" fill="#1f6feb" fill-opacity="0.35"><animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="9s" repeatCount="indefinite"/></path>
</g>
<rect x=".5" y=".5" width="1199" height="149" rx="20" fill="none" stroke="#30363d"/>
<text x="600" y="58" text-anchor="middle" class="mono" font-size="18" fill="#e6edf3">thanks for visiting<tspan fill="#58a6ff" class="blink">_</tspan></text>
