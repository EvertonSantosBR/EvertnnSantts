<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52" viewBox="0 0 220 52" role="img" aria-label="LinkedIn">
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<rect x="1" y="1" width="218" height="50" rx="12" fill="#161b22" stroke="#30363d"/>
<g transform="translate(22 17)"><rect x="0" y="0" width="18" height="18" rx="4" fill="#58a6ff"/><text x="9" y="13.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0d1117">in</text></g>
<text x="52" y="31" class="sans" font-size="15" font-weight="600" fill="#e6edf3">LinkedIn</text>
<text x="198" y="31" text-anchor="end" class="mono" font-size="15" fill="#58a6ff">→</text>
</svg>