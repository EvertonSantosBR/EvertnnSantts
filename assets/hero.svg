<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Everton Santos — Backend Developer</title>
<desc id="d">Banner animado com nome, cargo e um diagrama de uma requisição passando por API, serviços e banco de dados.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1a33"/></linearGradient>
  <radialGradient id="glow" cx=".8" cy=".45" r=".45"><stop offset="0" stop-color="#1f6feb" stop-opacity=".35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/></pattern>
  <linearGradient id="gfade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".6" stop-color="#fff" stop-opacity=".9"/></linearGradient>
  <mask id="m"><rect width="1200" height="320" fill="url(#gfade)"/></mask>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
</defs>
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  .flow{stroke-dasharray:4 7;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-22}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#m)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect y="318" width="1200" height="2" fill="url(#edge)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#30363d"/>
