<title id="t">LIBRAS Bridge</title>
<desc id="d">Comunicação entre médicos e pacientes surdos: sinais em LIBRAS viram texto e voz (MediaPipe + classificador ML) e o texto do médico vira LIBRAS pelo VLibras. Stack: Python, OpenCV, MediaPipe, scikit-learn.</desc>
<defs>
