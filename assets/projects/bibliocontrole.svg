<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270" role="img" aria-labelledby="t d">
<title id="t">BiblioControle</title>
<desc id="d">Gestão de bibliotecas: cadastro de leitores e livros, empréstimos, devoluções, disponibilidade do acervo e histórico — com versão desktop via Electron. Stack: Node.js, Express, MySQL, EJS, Electron.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#d29922" stop-opacity=".18"/><stop offset="1" stop-color="#d29922" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  .orbit{stroke-dasharray:120 1357;animation:orbit 7s linear infinite}
  @keyframes orbit{to{stroke-dashoffset:-1477}}</style>
<rect x="2" y="2" width="486" height="266" rx="16" fill="url(#bg)" stroke="#30363d"/>
<rect x="2" y="2" width="486" height="266" rx="16" fill="url(#glow)"/>
<rect x="2" y="2" width="486" height="266" rx="16" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-opacity=".9" class="orbit"/>
<rect x="28" y="30" width="4" height="62" rx="2" fill="#d29922"/>
<text x="464" y="248" text-anchor="end" class="mono" font-size="56" font-weight="700" fill="#d29922" fill-opacity=".08">04</text>
<g class="in" style="animation-delay:0.10s">
  <text x="46" y="46" class="mono" font-size="12" fill="#d29922" letter-spacing=".5">BACK-END · GESTÃO</text>
  <text x="46" y="84" class="sans" font-size="26" font-weight="700" fill="#e6edf3">BiblioControle</text>
</g>
