<g class="in" style="animation-delay:0.30s">
<text x="46" y="124" class="sans" font-size="15" fill="#8b949e">Gestão de bibliotecas: cadastro de leitores e livros,</text>
<text x="46" y="148" class="sans" font-size="15" fill="#8b949e">empréstimos, devoluções, disponibilidade do acervo e</text>
<text x="46" y="172" class="sans" font-size="15" fill="#8b949e">histórico — com versão desktop via Electron.</text>
</g>
