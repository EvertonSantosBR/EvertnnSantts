<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40" role="img" aria-label="Português">
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<path d="M10 .5H150V39.5H10A9.5 9.5 0 0 1 .5 30V10A9.5 9.5 0 0 1 10 .5Z" fill="#161b22" stroke="#30363d"/>
<text x="75" y="25" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#8b949e"><tspan class="mono" font-size="12" fill="#6e7681">PT</tspan>  Português</text>
</svg>