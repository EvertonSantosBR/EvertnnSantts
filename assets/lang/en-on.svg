<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40" role="img" aria-label="English">
<style>
  .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<path d="M0 .5H140A9.5 9.5 0 0 1 149.5 10V30A9.5 9.5 0 0 1 140 39.5H0Z" fill="#1f6feb" stroke="#58a6ff"/>
<circle cx="22" cy="20" r="4" fill="#e6edf3"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="84" y="25" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#e6edf3"><tspan class="mono" font-size="12" fill="#cae8ff">EN</tspan>  English</text>
</svg>