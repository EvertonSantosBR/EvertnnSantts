name: Atualizar README

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 em Salvador
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  cards:
    name: Cards de estatísticas e projetos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar SVGs
        run: node scripts/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: atualiza cards do perfil"
          git push

  snake:
    name: Gráfico de contribuições (snake)
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff
            dist/snake-light.svg?color_snake=#0d1117&color_dots=#ebedf0,#cae8ff,#79c0ff,#388bfd,#1158c7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
