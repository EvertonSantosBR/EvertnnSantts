name: Atualizar README

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 em Salvador
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  update:
    name: Cards, estatísticas e gráfico de contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar SVGs
        run: node scripts/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar gráfico de contribuições (snake)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff
      - name: Commit se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: atualiza cards do perfil"
          git push
